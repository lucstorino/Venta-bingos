<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" width="100%" height="100%">
  <defs>
    <linearGradient id="prizesBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="35%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="900" height="1200" fill="url(#prizesBg)"/>

  <!-- Decorative circles -->
  <circle cx="850" cy="100" r="180" fill="#10b981" fill-opacity="0.15"/>
  <circle cx="50" cy="800" r="220" fill="#fbbf24" fill-opacity="0.1"/>

  <!-- Gold Frame Border -->
  <rect x="30" y="30" width="840" height="1140" fill="none" stroke="url(#goldGrad)" stroke-width="4" rx="20"/>
  <rect x="42" y="42" width="816" height="1116" fill="none" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.5" rx="14"/>

  <!-- Header -->
  <g transform="translate(450, 110)">
    <!-- Pill -->
    <rect x="-160" y="-30" width="320" height="38" rx="19" fill="#022c22" stroke="#34d399" stroke-width="1.5"/>
    <text x="0" y="-6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="3">SORTEO OFICIAL AUTORIZADO</text>
    
    <!-- Title -->
    <text x="0" y="60" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">TABLA DE PREMIOS OFICIALES</text>
    <text x="0" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">MÁS DE $85.000.000 EN JUEGO</text>
  </g>

  <!-- Top Hero Prize: Ronda Extraordinaria -->
  <g transform="translate(70, 260)">
    <rect x="0" y="0" width="760" height="175" rx="16" fill="#022c22" stroke="url(#goldGrad)" stroke-width="3"/>
    <rect x="25" y="-14" width="220" height="28" rx="14" fill="url(#goldGrad)"/>
    <text x="135" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle" letter-spacing="2">★ PREMIO EXTRAORDINARIO</text>
    
    <text x="35" y="55" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff">CASA A ESTRENAR TOTALMENTE EQUIPADA</text>
    <text x="35" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#a7f3d0">+ $5.000.000 en Efectivo para gastos de escrituración</text>
    
    <!-- Prize Tag -->
    <rect x="35" y="112" width="260" height="42" rx="10" fill="#065f46" stroke="#34d399" stroke-width="1.5"/>
    <text x="165" y="139" font-family="system-ui, -apple-system, monospace" font-size="22" font-weight="900" fill="#fbbf24" text-anchor="middle">VALOR: $50.000.000</text>
  </g>

  <!-- Prize 2: Auto 0km -->
  <g transform="translate(70, 460)">
    <rect x="0" y="0" width="760" height="135" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="30" y="24" width="110" height="26" rx="8" fill="#dbeafe"/>
    <text x="85" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#1e40af" text-anchor="middle">2º PREMIO</text>
    <text x="30" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0f172a">AUTOMÓVIL 0 KM PATENTADO</text>
    <text x="30" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b">Fiat Cronos 1.3 GSE 0km con flete y patentamiento incluido</text>
    <text x="730" y="80" font-family="system-ui, -apple-system, monospace" font-size="24" font-weight="900" fill="#047857" text-anchor="end">$ 22.000.000</text>
  </g>

  <!-- Prize 3: Moto + Efectivo -->
  <g transform="translate(70, 615)">
    <rect x="0" y="0" width="760" height="135" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="30" y="24" width="110" height="26" rx="8" fill="#fef3c7"/>
    <text x="85" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#92400e" text-anchor="middle">3º PREMIO</text>
    <text x="30" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0f172a">MOTO HONDA WAVE 110cc + EFECTIVO</text>
    <text x="30" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b">Motovehículo 0km + $2.000.000 acreditados en cuenta</text>
    <text x="730" y="80" font-family="system-ui, -apple-system, monospace" font-size="24" font-weight="900" fill="#047857" text-anchor="end">$ 6.500.000</text>
  </g>

  <!-- Prize 4: Líneas y Premios Menores -->
  <g transform="translate(70, 770)">
    <rect x="0" y="0" width="760" height="135" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="30" y="24" width="130" height="26" rx="8" fill="#ecfdf5"/>
    <text x="95" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#065f46" text-anchor="middle">4º AL 10º PREMIO</text>
    <text x="30" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0f172a">PREMIOS A LA LÍNEA Y BINGO REITERADOS</text>
    <text x="30" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#64748b">Premios en órdenes de compra y efectivo por ronda</text>
    <text x="730" y="80" font-family="system-ui, -apple-system, monospace" font-size="24" font-weight="900" fill="#047857" text-anchor="end">$ 6.500.000</text>
  </g>

  <!-- Notary & Fiscalization Badge -->
  <g transform="translate(70, 930)">
    <rect x="0" y="0" width="760" height="100" rx="16" fill="#022c22" stroke="#34d399" stroke-width="1.5"/>
    <text x="40" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#34d399">GARANTÍA DE ENTREGA ANTE ESCRIBANO PÚBLICO</text>
    <text x="40" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="#e2e8f0">Todos los bienes se entregan patentados, escriturados y libres de deudas en la sede central.</text>
  </g>

  <!-- Footer -->
  <text x="450" y="1100" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#a7f3d0" text-anchor="middle">TuBINGO.com • Plataforma Oficial de Bingos Digitales</text>
</svg>
